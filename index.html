<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2723">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PadelMeeting">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<title>PadelMeeting — Sport & Eleganza</title>
<script src="/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0E2723; --p900:#123430; --p800:#16403A; --p700:#1B4D45; --p600:#235C52;
  --line:rgba(124,238,208,.26); --lineSoft:rgba(124,238,208,.14);
  --neon:#5BF0CB; --neonDim:#34C9A8; --ivory:#F7F0DC;
  --ivoryDim:rgba(247,240,220,.82); --ivoryFaint:rgba(247,240,220,.55);
  --rust:#E07B4A; --gold:#EFD06A; --danger:#F06A80;
  --sans:'Outfit',system-ui,sans-serif; --serif:'Cormorant Garamond',serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;height:100dvh}
body{background:var(--void);font-family:var(--sans);color:var(--ivory);overflow:hidden;display:flex;justify-content:center}
::-webkit-scrollbar{width:0;height:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;transition:transform .12s ease}
button:active{transform:scale(.98)}
select{font-family:inherit}
select option{background:var(--p900);color:var(--ivory)}

/* organize state */
.org-date{width:100%;padding:11px 14px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ivory);font-size:14px;font-family:var(--sans);outline:none;-webkit-appearance:none}
.org-date:focus{border-color:var(--neon)}
.org-time{width:100%;padding:11px 14px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ivory);font-size:14px;font-family:var(--sans);outline:none}
.org-time:focus{border-color:var(--neon)}
.org-row{display:flex;gap:10px;margin-bottom:10px}
.org-row > *{flex:1}

/* home tiles */
.home-tile-main{
  display:flex;align-items:center;gap:16px;
  width:calc(100% - 36px);margin:10px 18px 0;
  padding:20px 22px;border-radius:16px;
  border:1px solid var(--neon);text-align:left;
  background:linear-gradient(135deg,var(--p600),var(--p800));
  color:var(--neon);box-shadow:0 0 24px #5BF0CB22,inset 0 0 24px #5BF0CB0e;
  position:relative;overflow:hidden;
}
.home-tile-main::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent,#5BF0CB28,transparent);
  transform:translateX(-120%);animation:sweep 3.4s ease-in-out infinite;
}
.htm-icon{font-size:38px;flex-shrink:0;position:relative;z-index:1}
.htm-body{flex:1;position:relative;z-index:1}
.htm-title{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:.04em}
.htm-sub{font-size:13px;color:rgba(91,240,203,.7);margin-top:4px;letter-spacing:.03em}
.htm-arrow{font-size:24px;opacity:.6;position:relative;z-index:1}

.home-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;margin:10px 18px 0;
}
.home-tile{
  display:flex;flex-direction:column;align-items:flex-start;
  padding:20px 18px 18px;border-radius:14px;text-align:left;
  border:1px solid var(--neon);
  background:linear-gradient(160deg,var(--p600),var(--p800));
  color:var(--ivory);
  box-shadow:0 0 24px #5BF0CB22,inset 0 0 16px rgba(91,240,203,.06);
  transition:border-color .18s,box-shadow .18s;
}
.home-tile:active{border-color:var(--neon);box-shadow:0 0 24px rgba(91,240,203,.30)}
.ht-icon{font-size:34px;margin-bottom:10px;line-height:1}
.ht-title{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:.04em}
.ht-sub{font-size:12px;color:var(--ivoryFaint);margin-top:5px;line-height:1.5}

/* backdrop */
.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(var(--lineSoft) 1px,transparent 1px),linear-gradient(90deg,var(--lineSoft) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000,transparent 75%);mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000,transparent 75%)}
.glowA{position:absolute;top:-10%;left:20%;width:380px;height:380px;background:radial-gradient(circle,#5BF0CB2e,transparent 70%);filter:blur(40px)}
.glowB{position:absolute;bottom:8%;right:5%;width:320px;height:320px;background:radial-gradient(circle,#E07B4A26,transparent 70%);filter:blur(50px)}
.scan{position:absolute;inset:0;opacity:.18;background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.12) 3px)}

/* shell */
.shell{position:relative;z-index:1;width:100%;max-width:440px;height:100vh;height:100dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#16403Aee,#0E2723f2);border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 80px rgba(0,0,0,.55)}

/* header */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:center;
  padding:10px 18px;background:#0E2723e0;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo-wrap{display:flex;align-items:center}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px))}
.page{padding:8px 18px 24px;animation:fade .35s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* section tag */
.stag{display:flex;align-items:center;gap:10px;margin:20px 0 12px}
.stag i{width:5px;height:5px;background:var(--neon);box-shadow:0 0 8px var(--neon);transform:rotate(45deg);display:block}
.stag span{font-size:12px;letter-spacing:.20em;text-transform:uppercase;color:var(--neon);font-family:var(--mono);font-weight:600}
.stag em{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);font-style:normal}

/* cards */
.card{background:linear-gradient(180deg,#1B4D4599,#123430bb);border:1px solid var(--line);border-radius:16px;padding:16px 18px;backdrop-filter:blur(6px)}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:999px;font-family:var(--mono);font-weight:600}
.pill.neon{background:#5BF0CB1f;border:1px solid #5BF0CB66;color:var(--neon)}
.pill.rust{background:#E07B4A24;border:1px solid #E07B4A73;color:var(--rust)}
.pill.gold{background:#EFD06A24;border:1px solid #EFD06A73;color:var(--gold)}
.pill.danger{background:#E0556B24;border:1px solid #E0556B73;color:var(--danger)}
.pill.ghost{background:#F4EBD30f;border:1px solid #F4EBD32e;color:var(--ivoryDim)}

/* hero */
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 22px 16px;gap:12px}
.hero-rating{font-family:var(--serif);font-size:64px;font-weight:700;line-height:.95;margin-top:14px;letter-spacing:-.01em}
.hero-rating sup{font-size:18px;color:var(--neon);margin-left:8px;font-family:var(--mono);text-shadow:0 0 10px var(--neon)}
.tags-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.track{height:7px;background:rgba(0,0,0,.4);border-radius:999px;overflow:hidden;border:1px solid var(--lineSoft)}
.fill{height:100%;background:linear-gradient(90deg,var(--neonDim),var(--neon));box-shadow:0 0 12px var(--neon);border-radius:999px;transition:width .6s}
.prog-lbls{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;color:var(--ivoryFaint);font-family:var(--mono);margin-bottom:6px}

/* stats */
.stats3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.statCard{background:linear-gradient(180deg,#1B4D4577,#12343099);border:1px solid var(--lineSoft);border-radius:12px;padding:12px}
.statCard .l{font-size:10px;letter-spacing:.14em;color:var(--ivoryFaint);font-family:var(--mono);text-transform:uppercase}
.statCard .v{font-size:26px;font-weight:700;margin-top:4px;font-family:var(--mono)}
.statCard .s{font-size:11px;color:var(--ivoryFaint);margin-top:2px}

/* cta */
.cta{position:relative;width:100%;margin-top:18px;padding:18px;border-radius:14px;border:1px solid var(--neon);
  background:linear-gradient(135deg,var(--p600),var(--p800));color:var(--neon);font-family:var(--mono);font-weight:700;font-size:16px;
  letter-spacing:.08em;overflow:hidden;box-shadow:0 0 20px #5BF0CB33,inset 0 0 20px #5BF0CB11}
.cta span{position:relative;z-index:2}
.cta::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(120deg,transparent,#5BF0CB40,transparent);transform:translateX(-120%);animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.cta:disabled{opacity:.4}
.linkBtn{width:100%;margin-top:10px;padding:12px;color:var(--neon);font-family:var(--mono);font-size:14px;letter-spacing:.05em;text-align:center}

/* rank rows */
.rrow{display:flex;align-items:center;gap:12px;padding:15px 4px;border-bottom:1px solid var(--lineSoft);border-left:2px solid transparent}
.rrow.compact{padding:12px 4px}
.rrow.me{background:#5BF0CB0f;border-radius:8px;padding-left:10px;padding-right:10px;border-left:2px solid var(--neon)}
.rrow .rk{width:28px;text-align:center;font-family:var(--mono);font-weight:700;font-size:15px}
.avatarSm{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(135deg,var(--p600),var(--p800));border:1px solid var(--line);color:var(--ivory);font-weight:700;font-size:14px}
.rrow .nm{flex:1;min-width:0}
.rrow .nm .n1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .nm .n2{font-size:12px;color:var(--ivoryFaint)}
.rrow .rt{text-align:right}
.rrow .rt .r1{font-family:var(--mono);font-size:18px;font-weight:700}
.rrow .rt .r2{font-size:11px;color:var(--ivoryFaint);font-family:var(--mono);letter-spacing:.06em}

/* chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px}
.chip{padding:8px 15px;border-radius:999px;border:1px solid var(--line);color:var(--ivoryDim);font-size:13px;white-space:nowrap}
.chip.active{background:#5BF0CB1a;border-color:var(--neon);color:var(--neon);font-weight:600}

/* band scale */
.bands{display:flex;gap:3px}
.band{height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-family:var(--mono)}

/* segmented */
.seg{display:flex;gap:8px}
.segBtn{flex:1;padding:14px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ivoryDim);font-size:14px;font-weight:500;transition:all .2s}
.segBtn.active{background:#5BF0CB18;border-color:var(--neon);color:var(--neon);font-weight:700;box-shadow:0 0 14px #5BF0CB33}

/* team builder */
.teamBlock{padding-left:12px;margin-bottom:4px}
.teamBlock .tt{font-size:11px;letter-spacing:.14em;font-family:var(--mono);text-transform:uppercase;margin-bottom:8px}
.selWrap{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.selLabel{font-size:11px;color:var(--ivoryFaint);font-family:var(--mono);width:76px;flex-shrink:0;letter-spacing:.02em}
.selBox{flex:1;min-width:0;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ivory);font-size:13px;-webkit-appearance:none;appearance:none;outline:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.selBox.fixed{color:var(--neon)}
.vs{text-align:center;margin:10px 0;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--rust);letter-spacing:.2em}

/* preview rows */
.prow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--lineSoft)}
.prow .pn{font-size:14px}
.prow .pd{font-size:16px;font-weight:700;font-family:var(--mono)}
.warn{font-size:12px;margin-top:8px;font-style:italic}

/* buttons */
.btnSolid{padding:13px 22px;border-radius:11px;border:1px solid var(--neon);background:#5BF0CB1a;color:var(--neon);font-weight:700;font-size:15px}
.btnGhost{padding:13px 22px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--ivoryDim);font-size:15px}
.btnSolidSm{padding:9px 16px;border-radius:9px;border:1px solid var(--neon);background:#5BF0CB1a;color:var(--neon);font-weight:700;font-size:13px}
.btnGhostSm{padding:9px 16px;border-radius:9px;border:1px solid #E07B4A66;background:transparent;color:var(--danger);font-size:13px}

/* matches */
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mgrid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.mside .pl{font-size:14px;line-height:1.5}
.mscore{font-family:var(--mono);font-size:13px;color:var(--ivoryDim);text-align:center;line-height:1.5}
.mfoot{margin-top:14px;display:flex;align-items:center;justify-content:space-between}

/* profile */
.avatarBig{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--p600),var(--p800));border:2px solid var(--neon);color:var(--neon);font-weight:700;font-size:32px;box-shadow:0 0 24px #5BF0CB44}
.irow{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--lineSoft)}
.irow:last-child{border-bottom:none}
.irow .k{font-size:14px;color:var(--ivoryFaint)}
.irow .v{font-size:14px;font-weight:500}

/* rules accordion */
.acc{margin-bottom:8px;padding:0;overflow:hidden}
.acc .ah{display:flex;align-items:center;justify-content:space-between;padding:17px 18px}
.acc .ah .at{font-size:16px;font-weight:600}
.acc .ah .ax{color:var(--neon);font-size:20px;transition:transform .25s}
.acc.open .ah .ax{transform:rotate(45deg)}
.acc .ab{padding:0 18px 18px;font-size:14px;color:var(--ivoryDim);line-height:1.65;border-top:1px solid var(--lineSoft);padding-top:14px;display:none}
.acc.open .ab{display:block}
/* rich rule body */
.ab p{margin:0 0 8px}
.ab p:last-child{margin-bottom:0}
.ab .note{font-style:italic;color:var(--ivoryFaint);font-size:11.5px;border-left:2px solid var(--lineSoft);padding-left:10px;margin:8px 0 0}
.ab .li{display:flex;gap:8px;margin:5px 0;align-items:flex-start}
.ab .li::before{content:'';width:5px;height:5px;background:var(--neon);box-shadow:0 0 6px var(--neon);transform:rotate(45deg);margin-top:6px;flex-shrink:0}
.ab .li.rust::before{background:var(--rust);box-shadow:0 0 6px var(--rust)}
.ab b{color:var(--ivory);font-weight:600}
.ab .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--lineSoft)}
.ab .kv:last-child{border-bottom:none}
.ab .kv .kk{color:var(--ivoryDim)}
.ab .kv .vv{font-family:var(--mono);font-weight:600;color:var(--neon);white-space:nowrap}
.ab .vv.pos{color:var(--neon)} .ab .vv.neg{color:var(--danger)} .ab .vv.gold{color:var(--gold)}
.ab .grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:8px 0}
.ab .grid2 .cell{display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;border-bottom:1px solid var(--lineSoft)}
.ab .grid2 .cell .vv{font-family:var(--mono);color:var(--neon);font-weight:600}
.ab .sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--neon);font-family:var(--mono);margin:12px 0 6px;font-weight:600}
.ab .sub.rust{color:var(--rust)}

/* mini match */
.mmini{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--lineSoft)}
.mmini .t{font-size:14px}
.mmini .d{font-size:12px;color:var(--ivoryFaint);font-family:var(--mono);margin-top:2px}

/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:30;
  display:flex;align-items:center;justify-content:space-around;padding:8px 8px calc(12px + env(safe-area-inset-bottom, 0px));background:#0E2723f8;backdrop-filter:blur(20px);border-top:1px solid rgba(91,240,203,.22)}
.navBtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;position:relative;color:rgba(247,240,220,.75)}
.navBtn.active{color:var(--neon)}
.navBtn.active .ic{text-shadow:0 0 12px var(--neon)}
.navBtn.active .nl{color:var(--neon);font-weight:700}
.navBtn.active::before{content:'';position:absolute;inset:4px 6px;border-radius:10px;background:rgba(91,240,203,.10);z-index:0}
.navBtn .ic{font-size:22px;position:relative;z-index:1}
.navBtn .nl{font-size:11px;letter-spacing:.04em;margin-top:4px;font-family:var(--mono);font-weight:500;position:relative;z-index:1}
.navBtn .dot{position:absolute;bottom:0;width:4px;height:4px;border-radius:50%;background:var(--neon);box-shadow:0 0 6px var(--neon)}
.notif-badge{position:absolute;top:4px;right:8px;min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;font-family:var(--mono);display:flex;align-items:center;justify-content:center;padding:0 4px;z-index:2;box-shadow:0 0 8px var(--danger)}
.notif-card{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--lineSoft);cursor:pointer;transition:background .15s}
.notif-card:last-child{border-bottom:none}
.notif-card:active{background:rgba(91,240,203,.07)}
.notif-card-icon{font-size:22px;flex-shrink:0;padding-top:2px}
.notif-card-body{flex:1;min-width:0}
.notif-card-title{font-size:14px;font-weight:700;color:var(--ivory);margin-bottom:2px}
.notif-card-text{font-size:12px;color:var(--ivoryFaint);line-height:1.4}
.navPlay{flex:0 0 auto;width:50px;height:50px;border-radius:50%;margin-top:-22px;background:linear-gradient(135deg,var(--neon),var(--neonDim));border:2px solid #0A1C19;box-shadow:0 0 20px #5BF0CB88;color:#0A1C19}
.navPlay .ic{font-size:20px;color:#0A1C19}

/* utility text colors */
.c-neon{color:var(--neon)} .c-gold{color:var(--gold)} .c-rust{color:var(--rust)}
.c-ivory{color:var(--ivory)} .c-dim{color:var(--ivoryDim)} .c-faint{color:var(--ivoryFaint)}
.c-good{color:var(--neon)} .c-danger{color:var(--danger)}
.glow{color:var(--neon);text-shadow:0 0 12px #5BF0CB66}
.center{text-align:center}

/* ====== AUTH GATE ====== */
#auth-gate{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;
  padding:24px 18px;overflow-y:auto;
  background:linear-gradient(160deg,#0D3028 0%,#091C16 55%,#050C09 100%)}
.ag-grid{position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(91,240,203,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(91,240,203,.07) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse 100% 70% at 50% 0%,#000,transparent 80%);
  mask-image:radial-gradient(ellipse 100% 70% at 50% 0%,#000,transparent 80%)}
.ag-scan{position:fixed;inset:0;pointer-events:none;opacity:.12;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 3px)}
.ag-glow-a{position:fixed;top:-18%;left:50%;transform:translateX(-50%);width:750px;height:750px;
  background:radial-gradient(circle,rgba(91,240,203,.38),transparent 55%);filter:blur(65px);pointer-events:none}
.ag-glow-b{position:fixed;bottom:-14%;right:-6%;width:520px;height:520px;
  background:radial-gradient(circle,rgba(224,123,74,.28),transparent 58%);filter:blur(55px);pointer-events:none}
.ag-glow-c{position:fixed;top:40%;left:50%;transform:translateX(-50%);width:720px;height:300px;
  background:radial-gradient(ellipse,rgba(91,240,203,.10),transparent 62%);filter:blur(50px);pointer-events:none}
.auth-card{position:relative;width:100%;max-width:420px;z-index:1;
  background:rgba(10,50,42,.70);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);
  border:1px solid rgba(91,240,203,.38);border-radius:24px;padding:38px 30px 34px;
  box-shadow:0 0 0 1px rgba(91,240,203,.10),0 0 100px rgba(91,240,203,.16),0 32px 80px rgba(0,0,0,.55);
  overflow:hidden}
.auth-card::before{content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent,rgba(91,240,203,.07),transparent);
  transform:translateX(-120%);animation:sweep 5s ease-in-out infinite}
.auth-tabs{display:flex;background:rgba(0,0,0,.35);border-radius:12px;padding:4px;margin-bottom:26px}
.auth-tab{flex:1;padding:9px;border-radius:9px;font-family:var(--mono);font-size:13px;font-weight:600;
  letter-spacing:.06em;color:rgba(255,255,255,.80);transition:all .22s ease;border:none;background:none;cursor:pointer}
.auth-tab.active{background:rgba(91,240,203,.16);color:var(--neon);
  box-shadow:0 0 14px rgba(91,240,203,.16);text-shadow:0 0 8px rgba(91,240,203,.55)}
.auth-label{font-size:10px;font-family:var(--mono);font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:rgba(255,255,255,.90);margin-bottom:6px;display:block}
.auth-input{width:100%;padding:13px 14px;border-radius:10px;
  border:1.5px solid rgba(91,240,203,.16);background:rgba(0,0,0,.32);
  color:var(--ivory);font-size:15px;font-family:var(--sans);outline:none;
  transition:border-color .18s,box-shadow .18s,background .18s;-webkit-appearance:none;appearance:none}
.auth-input:focus{border-color:var(--neon);background:rgba(91,240,203,.05);
  box-shadow:0 0 0 3px rgba(91,240,203,.12),0 0 22px rgba(91,240,203,.10)}
.auth-input::placeholder{color:rgba(255,255,255,.45)}
select.auth-input{-webkit-appearance:auto;appearance:auto;cursor:pointer}
select.auth-input option{background:#0E2723;color:#F7F0DC}
.auth-input-wrap{position:relative;display:flex;align-items:center}
.auth-input-wrap .auth-input{padding-right:46px}
.auth-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;padding:4px;
  color:rgba(247,240,220,.35);transition:color .15s;line-height:1;flex-shrink:0}
.auth-eye:hover{color:var(--neon)}
.auth-field{margin-bottom:15px}
.auth-btn{width:100%;padding:15px;border-radius:12px;margin-top:6px;
  background:linear-gradient(135deg,#5BF0CB,#2ED4A8);color:#071E18;
  font-family:var(--mono);font-size:14px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;
  border:none;cursor:pointer;box-shadow:0 4px 36px rgba(91,240,203,.48);
  transition:transform .12s,box-shadow .18s}
.auth-btn:hover{box-shadow:0 4px 56px rgba(91,240,203,.68)}
.auth-btn:active{transform:scale(.98)}
.auth-err{color:var(--danger);font-size:12px;font-family:var(--sans);font-weight:500;
  margin-top:10px;text-align:center;min-height:18px}
.auth-divider{display:flex;align-items:center;gap:12px;margin:18px 0 14px}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:rgba(91,240,203,.14)}
.auth-divider span{font-size:10px;font-family:var(--mono);color:rgba(255,255,255,.75);
  letter-spacing:.1em;white-space:nowrap}
.auth-role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.auth-role-btn{padding:16px 10px;border-radius:12px;border:1.5px solid rgba(91,240,203,.16);
  background:rgba(0,0,0,.28);color:rgba(255,255,255,.85);font-family:var(--mono);font-size:11px;
  font-weight:600;letter-spacing:.05em;text-align:center;cursor:pointer;transition:all .20s}
.auth-role-btn.sel{border-color:var(--neon);background:rgba(91,240,203,.14);
  color:var(--ivory);box-shadow:0 0 20px rgba(91,240,203,.18)}
.auth-role-icon{font-size:24px;margin-bottom:7px;display:block}
@keyframes dotpulse{0%,80%,100%{transform:scale(.65);opacity:.4}40%{transform:scale(1.1);opacity:1}}
@media(prefers-reduced-motion:reduce){.auth-card::before,.ag-glow-a,.ag-glow-b,.ag-glow-c{animation:none!important}}
select option{background:#0E2723;color:var(--ivory)}
#cookie-banner{
  position:fixed;bottom:0;left:0;right:0;z-index:9999;
  background:#0E2723ee;backdrop-filter:blur(12px);
  border-top:1px solid rgba(91,240,203,.25);
  padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
#cookie-banner p{font-size:12px;color:rgba(247,240,220,.75);line-height:1.5;margin:0;flex:1}
#cookie-banner a{color:var(--neon);text-decoration:underline}
#cookie-ok{flex-shrink:0;padding:9px 18px;border-radius:10px;border:1px solid var(--neon);
  background:rgba(91,240,203,.12);color:var(--neon);font-family:var(--mono);font-size:12px;
  font-weight:700;letter-spacing:.06em;cursor:pointer}
</style>
</head>
<body>
<div id="cookie-banner" style="display:none">
  <p>Questo sito utilizza solo cookie tecnici necessari al funzionamento. Nessun cookie di profilazione o marketing. <a href="/cookie.pdf" target="_blank">Cookie Policy</a></p>
  <button id="cookie-ok" onclick="dismissCookie()">Ho capito</button>
</div>
<div class="backdrop"><div class="grid"></div><div class="glowA"></div><div class="glowB"></div><div class="scan"></div></div>
<div id="auth-gate"></div>
<div class="shell" id="app-shell">
  <header>
    <div class="logo-wrap">
      <img src="/PadelMeeting_header.png" alt="PadelMeeting"
           style="height:36px;width:auto">
    </div>
  </header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>

<script>
/* ============ DATA ============ */
const C = { neon:'#5BF0CB', neonDim:'#34C9A8', ivory:'#F7F0DC', ivoryDim:'rgba(247,240,220,.82)',
  ivoryFaint:'rgba(247,240,220,.55)', rust:'#E07B4A', gold:'#EFD06A', danger:'#F06A80', void:'#0A1C19' };

const BANDS = [
  {name:'Ferro',   short:'FER', min:0,  max:25,  color:'#7B8FA1'},
  {name:'Bronzo',  short:'BRO', min:26, max:45,  color:'#CD7F32'},
  {name:'Argento', short:'ARG', min:46, max:65,  color:'#C0C0C0'},
  {name:'Oro',     short:'ORO', min:66, max:80,  color:'#EFD06A'},
  {name:'Platino', short:'PLA', min:81, max:95,  color:'#5BF0CB'},
  {name:'Élite',   short:'ÉLI', min:96, max:100, color:'#F06A80'},
];
const bandIdx = r => r<26?0:r<46?1:r<66?2:r<81?3:r<96?4:5;
const bandName = r => BANDS[bandIdx(r)].name;
const bandColor = r => BANDS[bandIdx(r)].color;
const isHigh = r => r>=66;

let players = [];
let matches = [];
let ME = null;
let tab = 'home';
let clubs_list = [];
let notifications = [];
let clubPendingMatches = [];
let pendingPlayers = [];
let myInvites = [];
let pl = { partner:null, opp1:null, opp2:null, winner:1, done:false };

/* ============ HELPERS ============ */
const $ = (s,el=document)=>el.querySelector(s);
const me = ()=>players.find(p=>p.id===ME);
const pName = id => (players.find(p=>p.id===id)||{}).name || '—';
const ranked = ()=>[...players].sort((a,b)=>b.rating-a.rating);
const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

const dynK = games => 3.6;
function teamAvg(ids){return ids.reduce((s,id)=>s+((players.find(p=>p.id===id)||{}).rating||0),0)/ids.length}

function computeMatch(t1,t2,format,winnerTeam){
  const avg1=teamAvg(t1), avg2=teamAvg(t2);
  const E1=1/(1+Math.pow(10,(avg2-avg1)/50));
  const res={};
  [1,2].forEach(team=>{
    const ids=team===1?t1:t2;
    const E=team===1?E1:1-E1;
    const won=team===winnerTeam;
    ids.forEach(id=>{
      const p=players.find(x=>x.id===id);
      const K=dynK(p?p.games:8);
      const delta=+(K*((won?1:0)-E)).toFixed(1);
      res[id]={delta,won,E:+E.toFixed(3),K};
    });
  });
  return {avg1,avg2,diff:Math.abs(avg1-avg2),E1,res};
}

/* ============ EMBLEM SVG ============ */
function emblem(size){
  const ticks = Array.from({length:16}).map((_,i)=>{
    const a=i/16*Math.PI*2; return `<circle cx="${(50+Math.cos(a)*43).toFixed(1)}" cy="${(50+Math.sin(a)*43).toFixed(1)}" r="0.9" fill="${C.rust}" opacity="0.7"/>`;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none" style="filter:drop-shadow(0 0 8px ${C.neon}55)">
    <circle cx="50" cy="50" r="46" stroke="${C.neon}" stroke-width="1.5" opacity=".9"/>
    <circle cx="50" cy="50" r="40" stroke="${C.rust}" stroke-width=".8" opacity=".7"/>
    <circle cx="50" cy="50" r="33" stroke="${C.neon}" stroke-width=".6" stroke-dasharray="2 3" opacity=".5"/>
    <rect x="38" y="30" width="24" height="40" stroke="${C.ivory}" stroke-width=".7" opacity=".55"/>
    <line x1="38" y1="50" x2="62" y2="50" stroke="${C.ivory}" stroke-width=".6" opacity=".45"/>
    <g stroke="${C.neon}" stroke-width="1.6" stroke-linecap="round"><line x1="42" y1="66" x2="56" y2="40"/><line x1="58" y1="66" x2="44" y2="40"/></g>
    <ellipse cx="56" cy="38" rx="6" ry="7.5" stroke="${C.neon}" stroke-width="1.4" transform="rotate(20 56 38)"/>
    <ellipse cx="44" cy="38" rx="6" ry="7.5" stroke="${C.neon}" stroke-width="1.4" transform="rotate(-20 44 38)"/>
    ${ticks}
  </svg>`;
}

/* ============ COMPONENTS ============ */
const stag = t => `<div class="stag"><i></i><span>${t}</span><em></em></div>`;
const pill = (t,tone)=>`<span class="pill ${tone}">${t}</span>`;

function rankRow(p,rank,compact){
  const mine=p.id===ME;
  const medal = rank===1?C.gold:rank===2?'#C9D1D0':rank===3?C.rust:null;
  const star = '';
  return `<div class="rrow ${mine?'me':''} ${compact?'compact':''}">
    <div class="rk" style="color:${medal||C.ivoryFaint};text-shadow:${medal?`0 0 10px ${medal}88`:'none'}">${rank}</div>
    <div class="avatarSm" style="border-color:${mine?C.neon:'var(--line)'}">${esc(p.name[0])}</div>
    <div class="nm"><div class="n1" style="font-weight:${mine?700:500}">${esc(p.name)}${star}</div><div class="n2">${esc(p.club)} · ${esc(p.provincia)}</div></div>
    <div class="rt"><div class="r1" style="color:${isHigh(p.rating)?bandColor(p.rating):C.ivory};text-shadow:${isHigh(p.rating)?`0 0 8px ${bandColor(p.rating)}55`:'none'}">${p.rating.toFixed(1)}</div>
    <div class="r2">${bandName(p.rating).toUpperCase()}</div></div>
  </div>`;
}

function statCard(l,v,sub,col){
  return `<div class="statCard"><div class="l">${l}</div><div class="v" style="color:${col};text-shadow:0 0 10px ${col}44">${v}</div><div class="s">${sub}</div></div>`;
}

function matchMini(m){
  const nm = id=>esc(pName(id).replace(' (Demo)',''));
  return `<div class="mmini"><div>
    <div class="t">${m.t1.map(nm).join(' & ')} <span class="c-rust" style="font-style:italic">vs</span> ${m.t2.map(nm).join(' & ')}</div>
    <div class="d">${m.when} · ${m.format}</div></div>
    ${m.status==='pending'?pill('48h','gold'):pill('✓','neon')}</div>`;
}

/* ============ VIEWS ============ */
function viewHome(){
  const M=me(), pos=ranked().findIndex(p=>p.id===ME)+1;
  const unread=notifications.filter(n=>!n.read);
  const notifSection=unread.length?`
    <div class="card rise" style="margin-bottom:12px;padding:0;overflow:hidden">
      <div style="padding:10px 16px 8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ivoryFaint);text-transform:uppercase">Notifiche</div>
      ${unread.map(n=>`
        <div class="notif-card">
          <div class="notif-card-icon">${n.type==='match_confirmed'?'🎾':'📬'}</div>
          <div class="notif-card-body">
            <div class="notif-card-title">${esc(n.title)}</div>
            ${n.body?`<div class="notif-card-text">${esc(n.body)}</div>`:''}
            ${n.type==='match_invite'?`
            <div style="display:flex;gap:8px;margin-top:10px">
              <button onclick="respondNotification('${n.id}','accepted')"
                style="flex:1;padding:7px 0;border-radius:8px;background:var(--neon);color:#0E2723;font-weight:700;font-size:13px;border:none;cursor:pointer">
                ✓ Accetto
              </button>
              <button onclick="respondNotification('${n.id}','declined')"
                style="flex:1;padding:7px 0;border-radius:8px;background:var(--rust);color:#fff;font-weight:700;font-size:13px;border:none;cursor:pointer">
                ✗ Declino
              </button>
            </div>`:''}
          </div>
          ${n.type!=='match_invite'?`<div onclick="markNotificationRead('${n.id}')" style="color:var(--ivoryFaint);font-size:18px;flex-shrink:0;cursor:pointer">×</div>`:''}
        </div>`).join('')}
    </div>`:'';
  return `<div class="page">
    <!-- Logo -->
    <div class="rise" style="display:flex;justify-content:center;padding:22px 0 16px">
      <img src="/Logo_PadelMeeting.png" alt="PadelMeeting"
           style="width:220px;height:auto;filter:drop-shadow(0 0 18px #5BF0CB33)">
    </div>

    ${notifSection}

    <!-- TILE PRINCIPALE: Organizza -->
    <button class="home-tile-main rise" onclick="go('organize')" style="animation-delay:.05s">
      <div class="htm-icon">📅</div>
      <div class="htm-body">
        <div class="htm-title">Organizza partita</div>
        <div class="htm-sub">Pianifica · Invita · Bilancia le coppie</div>
      </div>
      <div class="htm-arrow">→</div>
    </button>

    <!-- TILE SECONDARIO: Registra -->
    <button class="home-tile-main rise" onclick="go('play')" style="animation-delay:.10s">
      <div class="htm-icon">⚡</div>
      <div class="htm-body">
        <div class="htm-title">Registra partita</div>
        <div class="htm-sub">Inserisci il risultato · calcola i punti</div>
      </div>
      <div class="htm-arrow">→</div>
    </button>

    <!-- GRIGLIA 2×2 -->
    <div class="home-grid">
      <button class="home-tile rise" onclick="go('rank')" style="animation-delay:.15s">
        <div class="ht-icon" style="color:${C.neon}">≡</div>
        <div class="ht-title">Classifica</div>
        <div class="ht-sub">Rating · Fasce · Circoli</div>
      </button>
      <button class="home-tile rise" onclick="go('matches')" style="animation-delay:.20s">
        <div class="ht-icon" style="color:${C.gold}">⊞</div>
        <div class="ht-title">Partite</div>
        <div class="ht-sub">Storico · Approva · Contesta</div>
      </button>
      <button class="home-tile rise" onclick="go('profile')" style="animation-delay:.25s">
        <div class="ht-icon" style="color:${C.neon}">◉</div>
        <div class="ht-title">Profilo</div>
        <div class="ht-sub">Dati individuali</div>
      </button>
      <button class="home-tile rise" onclick="go('rules')" style="animation-delay:.30s">
        <div class="ht-icon" style="color:${C.rust}">§</div>
        <div class="ht-title">Sintesi Regole</div>
        <div class="ht-sub">Regolamento</div>
      </button>
    </div>
  </div>`;
}

function viewRank(){
  const r=ranked();
  const clubs=['all',...new Set(r.map(p=>p.club))];
  const list = rankFilter==='all'?r:r.filter(p=>p.club===rankFilter);
  const bandsList = [...BANDS].reverse().map(b=>`
    <div style="display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--lineSoft)">
      <div style="width:10px;height:10px;border-radius:50%;background:${b.color};box-shadow:0 0 8px ${b.color}88;flex-shrink:0"></div>
      <span style="flex:1;font-size:15px;font-weight:600;color:${b.color}">${b.name}</span>
      <span style="font-family:var(--mono);font-size:13px;color:var(--ivoryFaint)">${b.min} – ${b.max}</span>
    </div>`).join('');

  return `<div class="page">
    ${stag('Classifica')}
    <div class="chips">${clubs.map(c=>`<button class="chip ${rankFilter===c?'active':''}" onclick="setFilter('${c.replace(/'/g,"")}')">${c==='all'?'Tutti i circoli':esc(c)}</button>`).join('')}</div>
    <div class="card" style="padding:6px 16px">${bandsList}</div>
    <div class="card" style="margin-top:10px">${list.map(p=>rankRow(p,r.findIndex(x=>x.id===p.id)+1,false)).join('')}</div>
  </div>`;
}
let rankFilter='all';
function setFilter(c){rankFilter=c;render()}

function viewPlay(){
  if(pl.done){
    return `<div class="page"><div class="card rise center" style="padding:44px 24px">
      <div style="font-size:40px;margin-bottom:8px">✓</div>
      <div style="font-family:var(--serif);font-size:30px;font-style:italic;color:${C.neon};text-shadow:0 0 14px ${C.neon}66">Partita registrata</div>
      <p class="c-dim" style="font-size:13.5px;line-height:1.6;max-width:320px;margin:12px auto 0">In attesa di approvazione del responsabile del circolo. Dopo l'approvazione, gli avversari potranno validare il punteggio e la classifica si aggiornerà.</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:22px">
        <button class="btnGhost" onclick="resetPlay()">Nuova partita</button>
        <button class="btnSolid" onclick="go('rank')">Vedi classifica</button></div>
    </div></div>`;
  }
  const others=players.filter(p=>p.id!==ME);
  const sortedOthers=others.slice().sort((a,b)=>{
    const p=a.provincia.localeCompare(b.provincia); if(p!==0) return p;
    const c=a.club.localeCompare(b.club); if(c!==0) return c;
    const f=bandIdx(b.rating)-bandIdx(a.rating); if(f!==0) return f;
    return a.name.split(' ').pop().localeCompare(b.name.split(' ').pop());
  });
  const t1=[ME,pl.partner], t2=[pl.opp1,pl.opp2];
  const valid=[...t1,...t2].every(Boolean)&&new Set([...t1,...t2]).size===4;
  const calc=valid?computeMatch(t1,t2,'classic',pl.winner):null;
  const opt=(sel,exclude)=>'<option value="">— seleziona —</option>'+sortedOthers.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''} ${exclude.includes(p.id)?'disabled':''}>(${p.provincia}) ${esc(p.name)} · ${p.rating.toFixed(1)} · ${bandName(p.rating)}</option>`).join('');

  let preview='';
  if(calc){
    // ME è sempre in t1 — calcolo diretto senza dipendere da pl.winner
    const K=calc.res[ME].K;
    const ptSeVinci=+(K*(1-calc.E1)).toFixed(1);
    const ptSePerdi=+(K*(0-calc.E1)).toFixed(1);

    const rows=[ME,pl.partner,pl.opp1,pl.opp2].map(id=>{
      const r=calc.res[id], up=r.delta>0;
      const col=up?C.neon:C.danger;
      return `<div class="prow"><span class="pn" style="color:${id===ME?C.neon:C.ivory};font-weight:${id===ME?700:500}">${esc(pName(id))} <span style="font-size:9px;color:var(--ivoryFaint)">K=${r.K}</span></span>
        <span class="pd" style="color:${col}">${up?'+':''}${r.delta.toFixed(1)}</span></div>`;
    }).join('');

    preview=`<div class="card rise" style="margin-top:14px">
      ${rows}
    </div>`;
  }

  return `<div class="page">
    ${stag('Registra partita')}
    <div style="font-size:11px;color:var(--ivoryFaint);font-family:var(--mono);margin-bottom:12px;letter-spacing:.06em">FORMATO: CLASSICA · 2 SU 3</div>
    <div class="card" style="margin-top:4px">
      <div class="teamBlock" style="border-left:2px solid ${C.neon}">
        <div class="tt" style="color:${C.neon}">La tua coppia</div>
        <div class="selWrap"><span class="selLabel">Tu</span><div class="selBox fixed">${esc(pName(ME))}</div></div>
        <div class="selWrap"><span class="selLabel">Compagno</span><select class="selBox" onchange="setPlay('partner',this.value)">${opt(pl.partner,[pl.opp1,pl.opp2])}</select></div>
      </div>
      <div class="vs">VS</div>
      <div class="teamBlock" style="border-left:2px solid ${C.rust}">
        <div class="tt" style="color:${C.rust}">Avversari</div>
        <div class="selWrap"><span class="selLabel">Avversario 1</span><select class="selBox" onchange="setPlay('opp1',this.value)">${opt(pl.opp1,[pl.partner,pl.opp2])}</select></div>
        <div class="selWrap"><span class="selLabel">Avversario 2</span><select class="selBox" onchange="setPlay('opp2',this.value)">${opt(pl.opp2,[pl.partner,pl.opp1])}</select></div>
      </div>
    </div>
    ${stag('Esito')}
    <div class="seg">
      <button class="segBtn ${pl.winner===1?'active':''}" onclick="setPlay('winner',1)">Vince la tua coppia</button>

async function confirmMatch(){
  const t1=[ME,pl.partner], t2=[pl.opp1,pl.opp2];
  if(![...t1,...t2].every(Boolean)||new Set([...t1,...t2]).size!==4) return;
  const calc=computeMatch(t1,t2,'classic',pl.winner);
  const winnerStr=pl.winner===1?'A':'B';
  const score=$('#play-score')?.value?.trim()||'';
  const club=me()?.club||auth.user?.club||'';
  const {error}=await sb.from('pm_matches').insert({
    club, winner:winnerStr, score,
    team_a1:t1[0], team_a2:t1[1],
    team_b1:t2[0], team_b2:t2[1],
    submitted_by:ME,
    played_at:new Date().toISOString().split('T')[0],
    delta_a1:calc.res[t1[0]].delta, delta_a2:calc.res[t1[1]].delta,
    delta_b1:calc.res[t2[0]].delta, delta_b2:calc.res[t2[1]].delta,
    status:'pending'
  });
  if(error){ alert('Errore invio: '+error.message); return; }
  await loadMatches();
  pl.done=true; render();
}

      else foot+=`<span style="font-size:11px;color:var(--ivoryFaint);font-style:italic;margin-left:6px">In attesa validazione avversari</span>`;

  }).join('');
  const inviteCards=myInvites.map(inv=>{
    const allAccepted=inv.players.length===3&&inv.players.every(s=>s.response==='accepted');
    const anyDeclined=inv.players.some(s=>s.response==='declined');
    const venue=inv.venue||'';
    const rows=inv.players.map(s=>{
      const icon=s.response==='accepted'?'✅':s.response==='declined'?'❌':'⏳';
      const color=s.response==='accepted'?'var(--neon)':s.response==='declined'?'var(--danger)':'var(--ivoryFaint)';
      const label=s.response==='accepted'?'Accettato':s.response==='declined'?'Declinato':'In attesa';
      return `<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--lineSoft)">
        <div style="font-size:14px;font-weight:500">${esc(s.name)}</div>
        <div style="font-size:12px;color:${color};font-family:var(--mono)">${icon} ${label}</div>
      </div>`;
    }).join('');
    const summary=allAccepted?`<div style="margin-top:10px;font-size:13px;color:var(--neon);font-weight:700">🎾 Tutti hanno accettato!</div>`
      :anyDeclined?`<div style="margin-top:10px;font-size:13px;color:var(--danger)">⚠ Un giocatore ha declinato.</div>`:'';
    return `<div class="card" style="margin-bottom:12px">
      <div class="mhead">
        <span style="font-size:11px;font-family:var(--mono);color:var(--neon);letter-spacing:.08em;text-transform:uppercase">Invito</span>

      </div>
      ${rows}${summary}

  }).join('');
  const orgSection=myInvites.length?`${stag('In organizzazione')}${inviteCards}`:'';
  return `<div class="page">${orgSection}${stag('Le mie partite')}${cards||`<div style="font-size:13px;color:var(--ivoryFaint);text-align:center;padding:24px 0">Nessuna partita ancora.</div>`}</div>`;

async function actMatch(id,status){
  const upd={status};
  if(status==='approved'){
    upd.approved_by=ME;
    const m=matches.find(x=>x.id===id)||clubPendingMatches.find(x=>x.id===id);
    if(m){
      const r=pid=>players.find(p=>p.id===pid)?.rating??0;
      const clamp=v=>+Math.max(0,Math.min(100,v)).toFixed(1);
      upd.rating_after_a1=clamp(r(m.t1[0])+(m.deltas[m.t1[0]]??0));
      upd.rating_after_a2=clamp(r(m.t1[1])+(m.deltas[m.t1[1]]??0));
      upd.rating_after_b1=clamp(r(m.t2[0])+(m.deltas[m.t2[0]]??0));
      upd.rating_after_b2=clamp(r(m.t2[1])+(m.deltas[m.t2[1]]??0));
    }
  }
  const {error}=await sb.from('pm_matches').update(upd).eq('id',id);
  if(error){ alert('Errore: '+error.message); return; }
  await loadMatches();
  if(status==='approved') await loadPlayers();
  if(auth.user?.role==='manager') await loadClubMatches();
  render();
}

async function sendOrg(){
  if(![ME,org.partner,org.opp1,org.opp2].every(Boolean)||new Set([ME,org.partner,org.opp1,org.opp2]).size!==4) return;
  const M=me();
  const nome=M?M.full_name:'Qualcuno';
  const dataStr=org.date||'data da definire';
  const luogo=org.venue==='__custom__'?(org.venueCustom||''):(org.venue||'');
  const bodyTxt=`${nome} ti ha invitato a una partita il ${dataStr} alle ${org.time}${luogo?' a '+luogo:''}`;
  const invited=[org.partner,org.opp1,org.opp2].filter(id=>id&&id!==ME);
  if(invited.length){
    const rows=invited.map(uid=>({
      user_id:uid,
      type:'match_invite',
      title:'Invito partita',
      body:bodyTxt,
      data:{organizer:ME,date:org.date,time:org.time,venue:luogo,partner:org.partner,opp1:org.opp1,opp2:org.opp2}
    }));
    await sb.from('pm_notifications').insert(rows);
  }
  org.sent=true;
  await loadMyInvites();
  render();
}

function go(t){
  const prev=tab;

  else if(t!=='play') pl.done=false;
  if(t==='matches'&&prev!=='matches') loadMyInvites().then(()=>render());
  window.scrollTo&&($('#view').scrollTop=0);
  render();
}

async function loadPlayers(){
  const {data,error}=await sb.from('pm_profiles')
    .select('id,full_name,club,city,provincia,rating,games,streak,role,status')
    .eq('status','active')
    .order('rating',{ascending:false});
  if(!error && data){
    players=data.map(p=>({
      id:p.id, name:p.full_name||'—',
      club:p.club||'', city:p.city||'', provincia:p.provincia||'',
      rating:p.rating??50, games:p.games??0, streak:p.streak??0, role:p.role
    }));
    // Inizializza pl e org con i primi giocatori disponibili (escluso ME)
    const others=players.filter(p=>p.id!==ME);
    if(!pl.partner && others[0]) pl.partner=others[0].id;
    if(!pl.opp1    && others[1]) pl.opp1=others[1].id;
    if(!pl.opp2    && others[2]) pl.opp2=others[2].id;
    if(!org.partner && others[0]) org.partner=others[0].id;
    if(!org.opp1    && others[1]) org.opp1=others[1].id;
    if(!org.opp2    && others[2]) org.opp2=others[2].id;
  }
}

async function loadMatches(){
  if(!ME) return;
  const {data,error}=await sb.from('pm_matches')
    .select('id,played_at,club,winner,score,status,submitted_by,team_a1,team_a2,team_b1,team_b2,delta_a1,delta_a2,delta_b1,delta_b2')
    .or(`team_a1.eq.${ME},team_a2.eq.${ME},team_b1.eq.${ME},team_b2.eq.${ME}`)
    .order('created_at',{ascending:false})
    .limit(30);
  if(!error && data){
    matches=data.map(m=>({
      id:m.id,
      when:new Date(m.played_at).toLocaleDateString('it-IT',{day:'2-digit',month:'short'}),
      format:'Classica', venue:m.club,
      t1:[m.team_a1,m.team_a2], t2:[m.team_b1,m.team_b2],
      score:m.score||'—', status:m.status,
      winner:m.winner==='A'?1:2, mover:m.submitted_by,
      deltas:{[m.team_a1]:m.delta_a1,[m.team_a2]:m.delta_a2,[m.team_b1]:m.delta_b1,[m.team_b2]:m.delta_b2}
    }));
  }
}

async function loadPendingPlayers(){
  const club=auth.user?.club;
  if(!club) return;
  const {data}=await sb.from('pm_profiles').select('id,full_name,club,email').eq('status','pending').eq('club',club);
  if(data) pendingPlayers=data.map(p=>({...p,name:p.full_name}));
}

async function loadClubMatches(){
  const club=auth.user?.club;
  if(!club) return;
  const clubIds=players.filter(p=>p.club===club).map(p=>p.id);
  if(!clubIds.length) return;
  const orFilter=clubIds.flatMap(id=>[`team_a1.eq.${id}`,`team_a2.eq.${id}`,`team_b1.eq.${id}`,`team_b2.eq.${id}`]).join(',');
  const {data}=await sb.from('pm_matches')
    .select('id,played_at,winner,score,status,submitted_by,team_a1,team_a2,team_b1,team_b2,delta_a1,delta_a2,delta_b1,delta_b2')
    .eq('status','pending').or(orFilter).order('created_at',{ascending:false});
  if(data) clubPendingMatches=data.map(m=>({
    id:m.id,
    when:new Date(m.played_at).toLocaleDateString('it-IT',{day:'2-digit',month:'short'}),
    t1:[m.team_a1,m.team_a2], t2:[m.team_b1,m.team_b2],
    score:m.score||'—', status:m.status,
    winner:m.winner==='A'?1:2, mover:m.submitted_by,
    deltas:{[m.team_a1]:m.delta_a1,[m.team_a2]:m.delta_a2,[m.team_b1]:m.delta_b1,[m.team_b2]:m.delta_b2}
  }));
}

async function loadMyInvites(){
  if(!ME) return;
  const {data}=await sb.from('pm_notifications')
    .select('user_id,data,created_at')
    .eq('type','match_invite')
    .filter('data->>organizer','eq',ME)
    .order('created_at',{ascending:false});
  if(!data){myInvites=[];return;}
  const groups={};
  data.forEach(n=>{
    const key=(n.data?.date||'')+'|'+(n.data?.time||'');
    if(!groups[key]) groups[key]={date:n.data?.date,time:n.data?.time,venue:n.data?.venue,
      partner:n.data?.partner,opp1:n.data?.opp1,opp2:n.data?.opp2,created_at:n.created_at,players:[]};
    groups[key].players.push({user_id:n.user_id,name:pName(n.user_id),response:n.data?.response||null});
  });
  myInvites=Object.values(groups).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
}

async function loadNotifications(){
  if(!ME) return;
  const {data}=await sb.from('pm_notifications').select('*').eq('user_id',ME).eq('read',false).order('created_at',{ascending:false}).limit(20);
  if(data) notifications=data;
}

async function markNotificationRead(id){
  await sb.from('pm_notifications').update({read:true}).eq('id',id);
  const n=notifications.find(x=>x.id===id);
  if(n) n.read=true;
  render();
}

async function respondNotification(id, response){
  const n=notifications.find(x=>x.id===id);
  const newData={...(n?.data||{}), response};
  await sb.from('pm_notifications').update({read:true, data:newData}).eq('id',id);
  if(n){ n.read=true; n.data=newData; }
  if(response==='accepted' && n?.type==='match_invite') await checkAllAccepted(n.data);
  render();
}

async function checkAllAccepted(inviteData){
  if(!inviteData?.organizer) return;
  const {data:allNotifs}=await sb.from('pm_notifications')
    .select('data').eq('type','match_invite')
    .filter('data->>organizer','eq',inviteData.organizer)
    .filter('data->>date','eq',inviteData.date||'')
    .filter('data->>time','eq',inviteData.time||'');
  if(!allNotifs||allNotifs.length<3) return;
  if(!allNotifs.every(n=>n.data?.response==='accepted')) return;

  const organizer=players.find(p=>p.id===inviteData.organizer);
  if(!organizer) return;
  const manager=players.find(p=>p.role==='manager'&&p.club===organizer.club&&p.id!==organizer.id);
  if(!manager) return;

  // evita duplicati
  const {data:existing}=await sb.from('pm_notifications')
    .select('id').eq('user_id',manager.id).eq('type','match_confirmed')
    .filter('data->>organizer','eq',inviteData.organizer)
    .filter('data->>date','eq',inviteData.date||'').limit(1);
  if(existing?.length) return;

  const getName=id=>players.find(p=>p.id===id)?.full_name||'?';
  const nomi=[inviteData.organizer,inviteData.partner,inviteData.opp1,inviteData.opp2].map(getName).join(' · ');
  const luogo=inviteData.venue?` a ${inviteData.venue}`:'';
  await sb.from('pm_notifications').insert({
    user_id:manager.id,
    type:'match_confirmed',
    title:'Partita confermata',
    body:`${inviteData.date||'?'} alle ${inviteData.time||'?'}${luogo} — ${nomi}`,
    data:inviteData
  });
}

async function loadProfile(user){
  const {data:profile}=await sb.from('pm_profiles').select('*').eq('id',user.id).single();
  if(!profile){ showGate(); return; }
  if(profile.status==='pending'){ auth.pendingProfile=profile; showGate(); return; }
  if(profile.status==='rejected'){ auth.rejectedProfile=profile; showGate(); return; }
  auth.user={...user,...profile}; auth.loggedIn=true;
  ME=user.id;
  await loadPlayers();
  await Promise.all([loadMatches(), loadNotifications(), loadMyInvites()]);
  if(profile.role==='manager'){ await Promise.all([loadClubMatches(), loadPendingPlayers()]); }
  if(profile.role==='admin') adminLoadAll();
  hideGate();
}

async function doLogin(){
  const email=$('#ai-email').value.trim(), pass=$('#ai-pass').value;
  if(!email||!pass){ auth.err='Compila tutti i campi'; renderAuth(); return; }
  auth.loading=true; renderAuth();
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  auth.loading=false;
  if(error){ auth.err=error.message==='Invalid login credentials'?'Email o password errati':error.message; renderAuth(); return; }
  await loadProfile(data.user);
}

async function doRegister(){
  const nome=$('#ar-nome').value.trim(), cognome=$('#ar-cognome').value.trim();
  const email=$('#ar-email').value.trim(), pass=$('#ar-pass').value;
  const pass2=$('#ar-pass2').value;
  let club=$('#ar-club')?.value.trim()||'';
  if(auth.role==='player' && club==='__no_club__'){
    const custom=$('#ar-club-custom')?.value.trim();
    if(!custom){ auth.err='Inserisci il nome del tuo circolo'; renderAuth(); return; }
    club=custom;
  }
  const city=$('#ar-city').value.trim();
  const provincia=$('#ar-provincia').value.trim().toUpperCase();
  const indirizzo=auth.role==='manager'?$('#ar-indirizzo').value.trim():'';
  const telefono=auth.role==='manager'?$('#ar-telefono').value.trim():'';
  if(!nome||!cognome||!email||!pass||!pass2||!club||!city||!provincia||(auth.role==='manager'&&(!indirizzo||!telefono))){
    auth.err='Compila tutti i campi'; renderAuth(); return; }
  if(!$('#ar-age')?.checked){ auth.err='Devi dichiarare di avere almeno 18 anni'; renderAuth(); return; }
  if(!$('#ar-termini')?.checked){ auth.err='Devi accettare i Termini d\'uso'; renderAuth(); return; }
  if(!$('#ar-privacy')?.checked){ auth.err='Devi accettare la Privacy Policy'; renderAuth(); return; }
  if(pass.length<6){ auth.err='Password minimo 6 caratteri'; renderAuth(); return; }
  if(pass!==pass2){ auth.err='Le password non coincidono'; renderAuth(); return; }
  auth.loading=true; renderAuth();
  const meta={full_name:nome+' '+cognome, role:auth.role, club, city, provincia};
  if(indirizzo) meta.indirizzo=indirizzo;
  if(telefono) meta.telefono=telefono;
  const {error}=await sb.auth.signUp({email,password:pass,options:{data:meta,emailRedirectTo:window.location.origin}});
  auth.loading=false;
  if(error){ auth.err=error.message; renderAuth(); return; }
  auth.registered=auth.role==='manager'?'pending':'verify'; renderAuth();
}

  auth.tab='reset-sent'; renderAuth();

async function doResetPassword(){
  const pass=$('#ar-newpass').value, pass2=$('#ar-newpass2').value;
  if(!pass||!pass2){ auth.err='Compila tutti i campi'; renderAuth(); return; }
  if(pass.length<6){ auth.err='Password minimo 6 caratteri'; renderAuth(); return; }
  if(pass!==pass2){ auth.err='Le password non coincidono'; renderAuth(); return; }
  auth.loading=true; renderAuth();
  const {error}=await sb.auth.updateUser({password:pass});
  auth.loading=false;
  if(error){ auth.err=error.message; renderAuth(); return; }
  auth.tab='login'; auth.err=''; renderAuth();
}

    sb.rpc('pm_get_pending_managers'),
    sb.from('pm_clubs').select('id,name,city,provincia,status,phone').order('name'),
    sb.from('pm_profiles').select('id,full_name,club,rating,games,role,status').order('full_name')
  ]);
  adminPending=pendingRes.data||[];
  adminClubs=clubsRes.data||[];

async function adminSetStatus(id,status){
  await sb.rpc('pm_set_profile_status',{profile_id:id,new_status:status});
  if(status==='active'){
    await sb.from('pm_profiles').update({rating:35}).eq('id',id).or('rating.is.null,rating.lte.0');
  }
  // Sync pm_clubs: attiva o rimuovi il circolo in base all'esito
  const {data:prof}=await sb.from('pm_profiles').select('club,city,provincia,indirizzo,telefono').eq('id',id).single();
  const clubName=prof?.club?.trim();
  if(clubName && clubName!=='EMPTY'){
    if(status==='active'){
      const {data:existing}=await sb.from('pm_clubs').select('id').eq('name',clubName).maybeSingle();
      if(existing){
        await sb.from('pm_clubs').update({status:'active'}).eq('id',existing.id);
      } else {
        await sb.from('pm_clubs').insert({name:clubName,city:prof.city||null,provincia:prof.provincia||null,address:prof.indirizzo||null,phone:prof.telefono||null,status:'active'});
      }
      await loadClubs();
    } else if(status==='rejected'){
      await sb.from('pm_clubs').delete().eq('name',clubName);
      await loadClubs();
    }
  }
  adminLoadPending();
}

    <button class="auth-btn" style="margin-top:20px;background:transparent;border:1px solid var(--neon);color:var(--neon);box-shadow:none" onclick="setAuthTab('login')">Torna al login</button>
  </div>`;

  if(auth.tab==='reset-password') return `${glows}<div class="auth-card rise">
    ${logo}
    <div style="font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.06em;color:${C.neon};margin-bottom:18px">Nuova password</div>
    <div class="auth-field"><label class="auth-label">Nuova password</label>
      <div class="auth-input-wrap">
        <input id="ar-newpass" type="password" class="auth-input" placeholder="••••••••" autocomplete="new-password">
        <button type="button" class="auth-eye" onclick="toggleEye('ar-newpass',this)" tabindex="-1">${eyeOpen}</button>
      </div></div>
    <div class="auth-field"><label class="auth-label">Conferma password</label>
      <div class="auth-input-wrap">
        <input id="ar-newpass2" type="password" class="auth-input" placeholder="••••••••" autocomplete="new-password">
        <button type="button" class="auth-eye" onclick="toggleEye('ar-newpass2',this)" tabindex="-1">${eyeOpen}</button>
      </div></div>
    ${auth.loading?spinner:`<button class="auth-btn" onclick="doResetPassword()">Salva nuova password →</button>`}
    <div class="auth-err">${auth.err}</div>
  </div>`;

  if(auth.registered==='pending') return `${glows}<div class="auth-card rise" style="text-align:center">
    ${logo}<div style="font-size:44px;margin-bottom:10px">⏳</div>
    <div style="font-family:var(--serif);font-size:22px;font-style:italic;color:${C.gold};margin-bottom:10px">Richiesta inviata</div>
    <p style="color:var(--ivoryDim);font-size:13px;line-height:1.65">La tua registrazione come <b>Responsabile Circolo</b> è in attesa di approvazione. Riceverai conferma via email.</p>
    <button class="auth-btn" style="margin-top:20px;background:transparent;border:1px solid var(--neon);color:var(--neon);box-shadow:none" onclick="setAuthTab('login')">Torna al login</button></div>`;

  if(auth.registered==='verify') return `${glows}<div class="auth-card rise" style="text-align:center">
    ${logo}<div style="font-size:44px;margin-bottom:10px">📧</div>
    <div style="font-family:var(--serif);font-size:22px;font-style:italic;color:${C.neon};margin-bottom:10px">Controlla la tua email</div>
    <p style="color:var(--ivoryDim);font-size:13px;line-height:1.65">Abbiamo inviato un link di conferma. Clicca il link per attivare l'account.</p>
    <button class="auth-btn" style="margin-top:20px;background:transparent;border:1px solid var(--neon);color:var(--neon);box-shadow:none" onclick="setAuthTab('login')">Torna al login</button></div>`;

  if(auth.pendingProfile){
    const isManager=auth.pendingProfile.role==='manager';
    const msg=isManager
      ?'Il tuo account come Responsabile Circolo è in corso di verifica da parte dell\'amministratore.'
      :'Il tuo profilo è in attesa di attivazione da parte del responsabile del tuo circolo.';
    return `${glows}<div class="auth-card rise" style="text-align:center">
    ${logo}<div style="font-size:44px;margin-bottom:10px">⏳</div>
    <div style="font-family:var(--serif);font-size:22px;font-style:italic;color:${C.gold};margin-bottom:10px">In attesa di approvazione</div>
    <p style="color:var(--ivoryDim);font-size:13px;line-height:1.65">${msg}</p>
    <button class="auth-btn" style="margin-top:20px;background:transparent;border:1px solid var(--danger);color:var(--danger);box-shadow:none" onclick="doLogout()">Esci</button></div>`;
  }

  if(auth.rejectedProfile) return `${glows}<div class="auth-card rise" style="text-align:center">
    ${logo}<div style="font-size:44px;margin-bottom:10px">❌</div>
    <div style="font-family:var(--serif);font-size:22px;font-style:italic;color:${C.danger};margin-bottom:10px">Richiesta non approvata</div>
    <p style="color:var(--ivoryDim);font-size:13px;line-height:1.65">La tua richiesta non è stata approvata. Contatta l'amministratore.</p>
    <button class="auth-btn" style="margin-top:20px;background:transparent;border:1px solid var(--neon);color:var(--neon);box-shadow:none" onclick="doLogout()">Torna al login</button></div>`;

  const loginForm=`
    <div class="auth-field"><label class="auth-label">Email</label>
      <input id="ai-email" type="email" class="auth-input" placeholder="la-tua@email.it" autocomplete="email"></div>
    <div class="auth-field"><label class="auth-label">Password</label>
      <div class="auth-input-wrap">
        <input id="ai-pass" type="password" class="auth-input" placeholder="••••••••"
          autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
        <button type="button" class="auth-eye" onclick="toggleEye('ai-pass',this)" tabindex="-1">${eyeOpen}</button>
      </div></div>
    ${auth.loading?spinner:`<button class="auth-btn" onclick="doLogin()">Accedi →</button>`}
    <div class="auth-err">${auth.err}</div>
    <button class="linkBtn" style="font-size:12px;opacity:.7" onclick="setAuthTab('reset-request')">Password dimenticata?</button>`;

  const regForm=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px">
      <div><label class="auth-label">Nome</label><input id="ar-nome" type="text" class="auth-input" placeholder="Mario"></div>
      <div><label class="auth-label">Cognome</label><input id="ar-cognome" type="text" class="auth-input" placeholder="Rossi"></div>
    </div>
    <div class="auth-field"><label class="auth-label">Email</label>
      <input id="ar-email" type="email" class="auth-input" placeholder="mario@email.it"></div>
    <div class="auth-field"><label class="auth-label">Password</label>
      <div class="auth-input-wrap">
        <input id="ar-pass" type="password" class="auth-input" placeholder="••••••••" autocomplete="new-password">
        <button type="button" class="auth-eye" onclick="toggleEye('ar-pass',this)" tabindex="-1">${eyeOpen}</button>
      </div></div>
    <div class="auth-field"><label class="auth-label">Conferma password</label>
      <div class="auth-input-wrap">
        <input id="ar-pass2" type="password" class="auth-input" placeholder="••••••••" autocomplete="new-password">
        <button type="button" class="auth-eye" onclick="toggleEye('ar-pass2',this)" tabindex="-1">${eyeOpen}</button>
      </div></div>
    <div class="auth-field"><label class="auth-label">${auth.role==='manager'?'Nome del nuovo circolo':'Circolo'}</label>
      ${auth.role==='player'?`<select id="ar-club" class="auth-input" autocomplete="off" onchange="onClubSelectChange(this)">
        <option value="">— Seleziona il tuo circolo —</option>
        ${clubOpts}
        <option value="__no_club__">Il mio circolo non è ancora registrato</option>
      </select>
      <div id="ar-club-custom-wrap" style="display:none;margin-top:10px">
        <label class="auth-label" style="margin-top:0">Nome del circolo desiderato</label>
        <input id="ar-club-custom" type="text" class="auth-input" placeholder="Es. Padel Club Eboli" autocomplete="off">
        <div style="font-size:12px;color:var(--ivoryDim);margin-top:6px;line-height:1.5">Inserisci il nome così possiamo contattarlo per affiliarlo.</div>
      </div>`:`<input id="ar-club" type="text" class="auth-input" placeholder="Nome del circolo" autocomplete="off">`}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div><label class="auth-label">Città</label>
        <input id="ar-city" type="text" class="auth-input" placeholder="Napoli" autocomplete="address-level2"></div>
      <div><label class="auth-label">Provincia</label>
        <input id="ar-provincia" type="text" class="auth-input" placeholder="NA" maxlength="3"></div>
    </div>
    ${auth.role==='manager'?`
    <div class="auth-field"><label class="auth-label">Indirizzo circolo</label>
      <input id="ar-indirizzo" type="text" class="auth-input" placeholder="Via Roma 1, Napoli" autocomplete="street-address"></div>
    <div class="auth-field"><label class="auth-label">Telefono</label>
      <input id="ar-telefono" type="tel" class="auth-input" placeholder="+39 081 123456" autocomplete="tel"></div>`:''}
    <div class="auth-divider"><span>Tipo di account</span></div>
    <div class="auth-role-grid">
      <button class="auth-role-btn ${auth.role==='player'?'sel':''}" onclick="setAuthRole('player')">
        <span class="auth-role-icon">🎾</span>Giocatore</button>
      <button class="auth-role-btn ${auth.role==='manager'?'sel':''}" onclick="setAuthRole('manager')">
        <span class="auth-role-icon">🏟️</span>Responsabile<br>Circolo</button>
    </div>
    <label style="display:flex;align-items:flex-start;gap:10px;margin-top:16px;cursor:pointer">
      <input id="ar-age" type="checkbox" style="margin-top:2px;width:16px;height:16px;accent-color:var(--neon);flex-shrink:0">
      <span style="font-size:13px;color:var(--ivoryDim);line-height:1.5">Dichiaro di avere almeno 18 anni</span>
    </label>
    <label style="display:flex;align-items:flex-start;gap:10px;margin-top:10px;cursor:pointer">
      <input id="ar-termini" type="checkbox" style="margin-top:2px;width:16px;height:16px;accent-color:var(--neon);flex-shrink:0">
      <span style="font-size:13px;color:var(--ivoryDim);line-height:1.5">Ho letto e accetto i <a href="/termini.pdf" target="_blank" style="color:var(--neon);text-decoration:underline">Termini d'uso</a></span>
    </label>
    <label style="display:flex;align-items:flex-start;gap:10px;margin-top:10px;cursor:pointer">
      <input id="ar-privacy" type="checkbox" style="margin-top:2px;width:16px;height:16px;accent-color:var(--neon);flex-shrink:0">
      <span style="font-size:13px;color:var(--ivoryDim);line-height:1.5">Ho letto e accetto la <a href="/privacy.pdf" target="_blank" style="color:var(--neon);text-decoration:underline">Privacy Policy</a></span>
    </label>
    ${auth.loading?spinner:`<button class="auth-btn" style="margin-top:14px" onclick="doRegister()">Crea account</button>`}
    <div class="auth-err">${auth.err}</div>`;

  return `${glows}<div class="auth-card rise">${logo}
    <div class="auth-tabs">
      <button class="auth-tab ${isLogin?'active':''}" onclick="setAuthTab('login')">Accedi</button>
      <button class="auth-tab ${!isLogin?'active':''}" onclick="setAuthTab('registrati')">Registrati</button>
    </div>
    ${isLogin?loginForm:regForm}</div>`;
}

let pendingRecovery=false;
sb.auth.onAuthStateChange((event)=>{
  if(event==='PASSWORD_RECOVERY'){
    pendingRecovery=true;
    auth.tab='reset-password'; auth.err='';
    showGate(); renderAuth();
  }
});

async function initAuth(){
  showGate();
  await loadClubs();
  const params=new URLSearchParams(window.location.search);
  const hash=new URLSearchParams(window.location.hash.slice(1));
  // Errori Supabase nel hash (link scaduto ecc.)
  if(hash.get('error')){
    history.replaceState({},'',window.location.pathname);
    const isReset=params.get('reset')==='1';
    auth.tab=isReset?'reset-request':'login';
    auth.err=hash.get('error_code')==='otp_expired'
      ? (isReset?'Il link è scaduto. Richiedine uno nuovo.':'Il link è scaduto. Riprova il login.')
      : (hash.get('error_description')||'Errore.').replace(/\+/g,' ');
    renderAuth(); return;
  }
  // Reset password: aspetta PASSWORD_RECOVERY, non caricare l'app
  if(params.get('reset')==='1'){
    renderAuth(); return;
  }
  // Conferma email (PKCE)
  const code=params.get('code');
  if(code){
    const {data,error}=await sb.auth.exchangeCodeForSession(code);
    history.replaceState({},'',window.location.pathname);
    if(!error && data.session){ await loadProfile(data.session.user); return; }
  }
  const {data:{session}}=await sb.auth.getSession();
  if(session){ await loadProfile(session.user); }
  else { renderAuth(); }
}
initAuth();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(() => {});
}
function dismissCookie(){
  localStorage.setItem('pm_cookie_ok','1');
  document.getElementById('cookie-banner').style.display='none';
}
if(!localStorage.getItem('pm_cookie_ok')){
  document.getElementById('cookie-banner').style.display='flex';
}
</script>

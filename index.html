<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2723">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PadelMeeting">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>PadelMeeting — Sport & Eleganza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0E2723; --p900:#123430; --p800:#16403A; --p700:#1B4D45; --p600:#235C52;
  --line:rgba(124,238,208,.26); --lineSoft:rgba(124,238,208,.14);
  --neon:#5BF0CB; --neonDim:#34C9A8; --ivory:#F7F0DC;
  --ivoryDim:rgba(247,240,220,.82); --ivoryFaint:rgba(247,240,220,.55);
  --rust:#E07B4A; --gold:#EFD06A; --danger:#F06A80;
  --sans:'Outfit',system-ui,sans-serif; --serif:'Cormorant Garamond',serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;height:100dvh}
body{background:var(--void);font-family:var(--sans);color:var(--ivory);overflow:hidden;display:flex;justify-content:center}
::-webkit-scrollbar{width:0;height:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;transition:transform .12s ease}
button:active{transform:scale(.98)}
select{font-family:inherit}
select option{background:var(--p900);color:var(--ivory)}

/* organize state */
.org-date{width:100%;padding:11px 14px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ivory);font-size:14px;font-family:var(--sans);outline:none;-webkit-appearance:none}
.org-date:focus{border-color:var(--neon)}
.org-time{width:100%;padding:11px 14px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ivory);font-size:14px;font-family:var(--sans);outline:none}
.org-time:focus{border-color:var(--neon)}
.org-row{display:flex;gap:10px;margin-bottom:10px}
.org-row > *{flex:1}

/* home tiles */
.home-tile-main{
  display:flex;align-items:center;gap:16px;
  width:calc(100% - 36px);margin:10px 18px 0;
  padding:20px 22px;border-radius:16px;
  border:1px solid var(--neon);text-align:left;
  background:linear-gradient(135deg,var(--p600),var(--p800));
  color:var(--neon);box-shadow:0 0 24px #5BF0CB22,inset 0 0 24px #5BF0CB0e;
  position:relative;overflow:hidden;
}
.home-tile-main::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,transparent,#5BF0CB28,transparent);
  transform:translateX(-120%);animation:sweep 3.4s ease-in-out infinite;
}
.htm-icon{font-size:34px;flex-shrink:0;position:relative;z-index:1}
.htm-body{flex:1;position:relative;z-index:1}
.htm-title{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:.04em}
.htm-sub{font-size:11px;color:rgba(91,240,203,.7);margin-top:3px;letter-spacing:.04em}
.htm-arrow{font-size:22px;opacity:.6;position:relative;z-index:1}

.home-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;margin:10px 18px 0;
}
.home-tile{
  display:flex;flex-direction:column;align-items:flex-start;
  padding:20px 18px 18px;border-radius:14px;text-align:left;
  border:1px solid var(--line);
  background:linear-gradient(160deg,#1B4D4555,#12343080);
  color:var(--ivory);
  transition:border-color .18s,box-shadow .18s;
}
.home-tile:active{border-color:var(--neon);box-shadow:0 0 16px #5BF0CB22}
.ht-icon{font-size:30px;margin-bottom:12px;line-height:1}
.ht-title{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.04em}
.ht-sub{font-size:10.5px;color:var(--ivoryFaint);margin-top:5px;line-height:1.5}

/* backdrop */
.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(var(--lineSoft) 1px,transparent 1px),linear-gradient(90deg,var(--lineSoft) 1px,transparent 1px);
  background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000,transparent 75%);mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000,transparent 75%)}
.glowA{position:absolute;top:-10%;left:20%;width:380px;height:380px;background:radial-gradient(circle,#5BF0CB2e,transparent 70%);filter:blur(40px)}
.glowB{position:absolute;bottom:8%;right:5%;width:320px;height:320px;background:radial-gradient(circle,#E07B4A26,transparent 70%);filter:blur(50px)}
.scan{position:absolute;inset:0;opacity:.18;background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.12) 3px)}

/* shell */
.shell{position:relative;z-index:1;width:100%;max-width:440px;height:100vh;height:100dvh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#16403Aee,#0E2723f2);border-left:1px solid var(--line);border-right:1px solid var(--line);box-shadow:0 0 80px rgba(0,0,0,.55)}

/* header */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:flex-start;
  padding:10px 18px;background:#0E2723e0;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo-wrap{display:flex;align-items:center}

main{flex:1;overflow-y:auto;padding-bottom:calc(90px + env(safe-area-inset-bottom, 0px))}
.page{padding:8px 18px 24px;animation:fade .35s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* section tag */
.stag{display:flex;align-items:center;gap:10px;margin:20px 0 12px}
.stag i{width:5px;height:5px;background:var(--neon);box-shadow:0 0 8px var(--neon);transform:rotate(45deg);display:block}
.stag span{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--neon);font-family:var(--mono);font-weight:600}
.stag em{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);font-style:normal}

/* cards */
.card{background:linear-gradient(180deg,#1B4D4599,#123430bb);border:1px solid var(--line);border-radius:16px;padding:16px 18px;backdrop-filter:blur(6px)}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:999px;font-family:var(--mono);font-weight:600}
.pill.neon{background:#5BF0CB1f;border:1px solid #5BF0CB66;color:var(--neon)}
.pill.rust{background:#E07B4A24;border:1px solid #E07B4A73;color:var(--rust)}
.pill.gold{background:#EFD06A24;border:1px solid #EFD06A73;color:var(--gold)}
.pill.danger{background:#E0556B24;border:1px solid #E0556B73;color:var(--danger)}
.pill.ghost{background:#F4EBD30f;border:1px solid #F4EBD32e;color:var(--ivoryDim)}

/* hero */
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 22px 16px;gap:12px}
.hero-rating{font-family:var(--serif);font-size:64px;font-weight:700;line-height:.95;margin-top:14px;letter-spacing:-.01em}
.hero-rating sup{font-size:18px;color:var(--neon);margin-left:8px;font-family:var(--mono);text-shadow:0 0 10px var(--neon)}
.tags-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.track{height:7px;background:rgba(0,0,0,.4);border-radius:999px;overflow:hidden;border:1px solid var(--lineSoft)}
.fill{height:100%;background:linear-gradient(90deg,var(--neonDim),var(--neon));box-shadow:0 0 12px var(--neon);border-radius:999px;transition:width .6s}
.prog-lbls{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;color:var(--ivoryFaint);font-family:var(--mono);margin-bottom:6px}

/* stats */
.stats3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.statCard{background:linear-gradient(180deg,#1B4D4577,#12343099);border:1px solid var(--lineSoft);border-radius:12px;padding:12px}
.statCard .l{font-size:9px;letter-spacing:.16em;color:var(--ivoryFaint);font-family:var(--mono);text-transform:uppercase}
.statCard .v{font-size:22px;font-weight:700;margin-top:4px;font-family:var(--mono)}
.statCard .s{font-size:9.5px;color:var(--ivoryFaint);margin-top:2px}

/* cta */
.cta{position:relative;width:100%;margin-top:18px;padding:16px;border-radius:14px;border:1px solid var(--neon);
  background:linear-gradient(135deg,var(--p600),var(--p800));color:var(--neon);font-family:var(--mono);font-weight:700;font-size:14px;
  letter-spacing:.08em;overflow:hidden;box-shadow:0 0 20px #5BF0CB33,inset 0 0 20px #5BF0CB11}
.cta span{position:relative;z-index:2}
.cta::before{content:'';position:absolute;inset:0;z-index:1;background:linear-gradient(120deg,transparent,#5BF0CB40,transparent);transform:translateX(-120%);animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{0%,60%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.cta:disabled{opacity:.4}
.linkBtn{width:100%;margin-top:10px;padding:10px;color:var(--neon);font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-align:center}

/* rank rows */
.rrow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--lineSoft);border-left:2px solid transparent}
.rrow.compact{padding:10px 4px}
.rrow.me{background:#5BF0CB0f;border-radius:8px;padding-left:10px;padding-right:10px;border-left:2px solid var(--neon)}
.rrow .rk{width:26px;text-align:center;font-family:var(--mono);font-weight:700;font-size:14px}
.avatarSm{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(135deg,var(--p600),var(--p800));border:1px solid var(--line);color:var(--ivory);font-weight:700;font-size:12px}
.rrow .nm{flex:1;min-width:0}
.rrow .nm .n1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .nm .n2{font-size:10px;color:var(--ivoryFaint)}
.rrow .rt{text-align:right}
.rrow .rt .r1{font-family:var(--mono);font-size:16px;font-weight:700}
.rrow .rt .r2{font-size:9px;color:var(--ivoryFaint);font-family:var(--mono);letter-spacing:.06em}

/* chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);color:var(--ivoryDim);font-size:12px;white-space:nowrap}
.chip.active{background:#5BF0CB1a;border-color:var(--neon);color:var(--neon);font-weight:600}

/* band scale */
.bands{display:flex;gap:3px}
.band{height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-family:var(--mono)}

/* segmented */
.seg{display:flex;gap:8px}
.segBtn{flex:1;padding:12px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ivoryDim);font-size:12.5px;font-weight:500;transition:all .2s}
.segBtn.active{background:#5BF0CB18;border-color:var(--neon);color:var(--neon);font-weight:700;box-shadow:0 0 14px #5BF0CB33}

/* team builder */
.teamBlock{padding-left:12px;margin-bottom:4px}
.teamBlock .tt{font-size:10px;letter-spacing:.16em;font-family:var(--mono);text-transform:uppercase;margin-bottom:8px}
.selWrap{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.selLabel{font-size:10.5px;color:var(--ivoryFaint);font-family:var(--mono);width:78px;flex-shrink:0;letter-spacing:.04em}
.selBox{flex:1;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--ivory);font-size:13px;-webkit-appearance:none;appearance:none;outline:none}
.selBox.fixed{color:var(--neon)}
.vs{text-align:center;margin:10px 0;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--rust);letter-spacing:.2em}

/* preview rows */
.prow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--lineSoft)}
.prow .pn{font-size:13px}
.prow .pd{font-size:14px;font-weight:700;font-family:var(--mono)}
.warn{font-size:11px;margin-top:8px;font-style:italic}

/* buttons */
.btnSolid{padding:11px 18px;border-radius:10px;border:1px solid var(--neon);background:#5BF0CB1a;color:var(--neon);font-weight:700;font-size:13px}
.btnGhost{padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ivoryDim);font-size:13px}
.btnSolidSm{padding:7px 14px;border-radius:8px;border:1px solid var(--neon);background:#5BF0CB1a;color:var(--neon);font-weight:700;font-size:12px}
.btnGhostSm{padding:7px 14px;border-radius:8px;border:1px solid #E07B4A66;background:transparent;color:var(--danger);font-size:12px}

/* matches */
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mgrid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.mside .pl{font-size:12.5px;line-height:1.5}
.mscore{font-family:var(--mono);font-size:12px;color:var(--ivoryDim);text-align:center;line-height:1.5}
.mfoot{margin-top:14px;display:flex;align-items:center;justify-content:space-between}

/* profile */
.avatarBig{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--p600),var(--p800));border:2px solid var(--neon);color:var(--neon);font-weight:700;font-size:32px;box-shadow:0 0 24px #5BF0CB44}
.irow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--lineSoft)}
.irow:last-child{border-bottom:none}
.irow .k{font-size:12.5px;color:var(--ivoryFaint)}
.irow .v{font-size:12.5px;font-weight:500}

/* rules accordion */
.acc{margin-bottom:8px;padding:0;overflow:hidden}
.acc .ah{display:flex;align-items:center;justify-content:space-between;padding:15px 18px}
.acc .ah .at{font-size:14px;font-weight:600}
.acc .ah .ax{color:var(--neon);font-size:18px;transition:transform .25s}
.acc.open .ah .ax{transform:rotate(45deg)}
.acc .ab{padding:0 18px 16px;font-size:12.5px;color:var(--ivoryDim);line-height:1.6;border-top:1px solid var(--lineSoft);padding-top:12px;display:none}
.acc.open .ab{display:block}
/* rich rule body */
.ab p{margin:0 0 8px}
.ab p:last-child{margin-bottom:0}
.ab .note{font-style:italic;color:var(--ivoryFaint);font-size:11.5px;border-left:2px solid var(--lineSoft);padding-left:10px;margin:8px 0 0}
.ab .li{display:flex;gap:8px;margin:5px 0;align-items:flex-start}
.ab .li::before{content:'';width:5px;height:5px;background:var(--neon);box-shadow:0 0 6px var(--neon);transform:rotate(45deg);margin-top:6px;flex-shrink:0}
.ab .li.rust::before{background:var(--rust);box-shadow:0 0 6px var(--rust)}
.ab b{color:var(--ivory);font-weight:600}
.ab .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--lineSoft)}
.ab .kv:last-child{border-bottom:none}
.ab .kv .kk{color:var(--ivoryDim)}
.ab .kv .vv{font-family:var(--mono);font-weight:600;color:var(--neon);white-space:nowrap}
.ab .vv.pos{color:var(--neon)} .ab .vv.neg{color:var(--danger)} .ab .vv.gold{color:var(--gold)}
.ab .grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:8px 0}
.ab .grid2 .cell{display:flex;justify-content:space-between;font-size:11.5px;padding:4px 0;border-bottom:1px solid var(--lineSoft)}
.ab .grid2 .cell .vv{font-family:var(--mono);color:var(--neon);font-weight:600}
.ab .sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--neon);font-family:var(--mono);margin:12px 0 6px;font-weight:600}
.ab .sub.rust{color:var(--rust)}

/* mini match */
.mmini{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--lineSoft)}
.mmini .t{font-size:12.5px}
.mmini .d{font-size:10px;color:var(--ivoryFaint);font-family:var(--mono);margin-top:2px}

/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:30;
  display:flex;align-items:center;justify-content:space-around;padding:8px 8px calc(12px + env(safe-area-inset-bottom, 0px));background:#0E2723f0;backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.navBtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;position:relative;color:var(--ivoryFaint)}
.navBtn.active{color:var(--neon)}
.navBtn .ic{font-size:17px}
.navBtn.active .ic{text-shadow:0 0 10px var(--neon)}
.navBtn .nl{font-size:8.5px;letter-spacing:.06em;margin-top:2px;font-family:var(--mono)}
.navBtn .dot{position:absolute;bottom:0;width:4px;height:4px;border-radius:50%;background:var(--neon);box-shadow:0 0 6px var(--neon)}
.navPlay{flex:0 0 auto;width:50px;height:50px;border-radius:50%;margin-top:-22px;background:linear-gradient(135deg,var(--neon),var(--neonDim));border:2px solid #0A1C19;box-shadow:0 0 20px #5BF0CB88;color:#0A1C19}
.navPlay .ic{font-size:20px;color:#0A1C19}

/* utility text colors */
.c-neon{color:var(--neon)} .c-gold{color:var(--gold)} .c-rust{color:var(--rust)}
.c-ivory{color:var(--ivory)} .c-dim{color:var(--ivoryDim)} .c-faint{color:var(--ivoryFaint)}
.c-good{color:var(--neon)} .c-danger{color:var(--danger)}
.glow{color:var(--neon);text-shadow:0 0 12px #5BF0CB66}
.center{text-align:center}
</style>
</head>
<body>
<div class="backdrop"><div class="grid"></div><div class="glowA"></div><div class="glowB"></div><div class="scan"></div></div>
<div class="shell">
  <header>
    <div class="logo-wrap">
      <img src="/PadelMeeting_header.png" alt="PadelMeeting"
           style="height:36px;width:auto">
    </div>
  </header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>

<script>
/* ============ DATA ============ */
const C = { neon:'#5BF0CB', neonDim:'#34C9A8', ivory:'#F7F0DC', ivoryDim:'rgba(247,240,220,.82)',
  ivoryFaint:'rgba(247,240,220,.55)', rust:'#E07B4A', gold:'#EFD06A', danger:'#F06A80', void:'#0A1C19' };

const BANDS = ['Zero','Uno','Due','Tre','Quattro','Cinque','Sei','Sette','Otto','Nove','Dieci'];
const bandIdx = r => r>=10?10:Math.max(0,Math.min(9,Math.floor(r)));
const bandName = r => BANDS[bandIdx(r)];
const isHigh = r => r>=7;

let players = [
  {id:1,name:'Ivano Casilli',club:'Padel Vesuvio',city:'Napoli',rating:9.85,fondo:0.15,streak:7},
  {id:2,name:'Luigi Rocco',club:'Padel Vesuvio',city:'Napoli',rating:8.40,fondo:0.30,streak:4},
  {id:3,name:'Giuliano Del Giudice',club:'Salerno Smash',city:'Salerno',rating:7.95,fondo:0.60,streak:2},
  {id:4,name:'Marta Esposito',club:'Salerno Smash',city:'Salerno',rating:7.10,fondo:0.00,streak:9},
  {id:5,name:'Davide Greco',club:'Padel Vesuvio',city:'Napoli',rating:6.55,fondo:0.45,streak:0,malus:0.5},
  {id:6,name:'Chiara Ferraro',club:'Costa Padel',city:'Sorrento',rating:6.20,fondo:0.10,streak:1},
  {id:7,name:'Antonio Russo',club:'Costa Padel',city:'Sorrento',rating:5.30,fondo:0.00,streak:3},
  {id:8,name:'Sara Bianchi',club:'Salerno Smash',city:'Salerno',rating:4.75,fondo:0.20,streak:0},
  {id:9,name:'Marco Romano',club:'Padel Vesuvio',city:'Napoli',rating:3.60,fondo:0.00,streak:5},
  {id:10,name:'Elena Conti',club:'Costa Padel',city:'Sorrento',rating:2.40,fondo:0.05,streak:0},
  {id:11,name:'Antonello Martux',club:'EVOSPORT',city:'Eboli',rating:5.95,fondo:0.35,streak:2},

function teamSum(ids){return ids.reduce((s,id)=>s+((players.find(p=>p.id===id)||{}).rating||0),0)}

function computeMatch(t1,t2,format,winnerTeam){
  const sum1=teamSum(t1), sum2=teamSum(t2), diff=Math.abs(sum1-sum2);
  const strong = sum1>=sum2?1:2;
  const f = format==='single'?0.5:1;
  let favWin,favLose,sfvWin,sfvLose;
  if(diff<=1.0){favWin=.2;favLose=-.2;sfvWin=.2;sfvLose=-.2;}
  else if(diff<=2.0){favWin=.1;favLose=-.3;sfvWin=.3;sfvLose=-.1;}
  else{favWin=0;favLose=-.4;sfvWin=.4;sfvLose=0;}
  const res={};
  [1,2].forEach(team=>{
    const ids=team===1?t1:t2, isStrong=team===strong, won=team===winnerTeam;
    let d = isStrong?(won?favWin:favLose):(won?sfvWin:sfvLose);
    d*=f;
    ids.forEach(id=>res[id]={delta:d,isStrong,won});
  });
  return {sum1,sum2,diff,strong,res};
}

function confirmMatch(){
  const t1=[ME,pl.partner], t2=[pl.opp1,pl.opp2];
  if(new Set([...t1,...t2]).size!==4) return;
  const calc=computeMatch(t1,t2,pl.format,pl.winner);
  players=players.map(p=>{
    const r=calc.res[p.id]; if(!r) return p;
    let {rating,fondo,streak}=p; let d=r.delta;
    if(d>=0){rating=Math.min(10,rating+d);}
    else{const fromFondo=Math.min(fondo,-d);fondo=+(fondo-fromFondo).toFixed(2);rating=Math.max(0,rating+(d+fromFondo));}
    if(pl.format==='classic') streak = r.won?streak+1:0;
    return {...p,rating:+rating.toFixed(2),fondo:+fondo.toFixed(2),streak};
  });
  matches.unshift({id:900+matches.length+Math.floor(Math.random()*1000),when:'Adesso',
    format:pl.format==='classic'?'Classica':'Set singolo',t1,t2,
    score:pl.format==='classic'?'6-3 / 4-6 / 6-2':'7-5',status:'pending',winner:pl.winner,mover:ME});
  pl.done=true; render();
}

     <div class="li"><span><b>Punto Secco:</b> un unico punto decisivo — chi lo vince si aggiudica il game.</span></div>`],

  ['Promozione',
    `<p>Per salire di fascia devi soddisfare <b>tutte</b> queste condizioni in una partita classica:</p>
     <div class="li">Vincere la partita (il set singolo non conta).</div>
     <div class="li">Battere almeno un giocatore della fascia superiore.</div>

     </div>`],

  ['Fondocassa',
    `<p>Il fondocassa è una <b>riserva separata</b> dal rating ufficiale, massimo <b>1,00 punto</b>. I punti vi finiscono quando non hai i requisiti per la promozione, o quando sei nelle fasce alte e la somma degli avversari è sotto soglia.</p>
     <div class="li">Quando perdi punti, vengono sottratti <b>prima dal fondocassa</b> e poi dal rating.</div>
     <div class="li">Nel calcolo dei coefficienti, al giocatore col punteggio <b>più alto in campo</b> si sommano anche i suoi punti fondocassa.</div>
     <p class="note">Alla promozione il fondocassa viene decurtato fino a 0,20 massimo.</p>`],

  ['Serie di vittorie ★',
    `<p>Vinci partite classiche di fila e accumuli <b>stelle</b> con bonus:</p>
     <div class="kv"><span class="kk">3 vittorie consecutive</span><span class="vv pos">+0,10</span></div>
     <div class="kv"><span class="kk">5 vittorie consecutive</span><span class="vv pos">+0,20 aggiuntivi</span></div>
     <div class="kv"><span class="kk">10 vittorie consecutive</span><span class="vv pos">+0,50 aggiuntivi</span></div>
     <p>Le stelle si perdono <b>tutte</b> alla prima sconfitta in una classica.</p>
     <p class="note">Una vittoria non conta per la serie se sei nella coppia favorita con differenza superiore a 1,0, o se nelle fasce alte non rispetti la soglia minima degli avversari.</p>`],

  ['Bounty 🎯',
    `<p>Se batti un giocatore in serie di vittorie, <b>entrambi</b> i giocatori della coppia vincitrice ricevono un bonus in fondocassa:</p>
     <div class="kv"><span class="kk">Gioca per la 3ª stella (ne ha 2)</span><span class="vv gold">+0,05 ciascuno</span></div>
     <div class="kv"><span class="kk">Gioca per la 5ª stella (ne ha 4)</span><span class="vv gold">+0,10 ciascuno</span></div>
     <div class="kv"><span class="kk">Gioca per la 10ª stella (ne ha 9)</span><span class="vv gold">+0,20 ciascuno</span></div>`],

  ['Inattività',
    `<p>Se non giochi partite classificate per <b>30 giorni consecutivi</b>, perdi punti. Ricevi una notifica 7 giorni prima del primo malus.</p>
     <div class="kv"><span class="kk">30° giorno</span><span class="vv neg">−0,10</span></div>
     <div class="kv"><span class="kk">Ogni settimana succ. (1° mese)</span><span class="vv neg">−0,10</span></div>
     <div class="kv"><span class="kk">Dal 2° mese</span><span class="vv neg">−0,20 / settimana</span></div>
     <div class="kv"><span class="kk">Dopo 4 mesi</span><span class="vv neg">Rimozione</span></div>
     <p class="note">Per infortunio o impegni lavorativi prolungati puoi richiedere la sospensione del conteggio al responsabile. Al rientro il conteggio riparte da zero.</p>`],

  ['Abbandono e ammonizioni',
    `<p>Se lasci il campo dopo il primo punto giocato, il risultato conta come <b>sconfitta</b> — indipendentemente dal motivo.</p>
     <div class="kv"><span class="kk">Abbandono giustificato</span><span class="vv">Solo perdita punti</span></div>
     <div class="kv"><span class="kk">Abbandono ingiustificato</span><span class="vv neg">−0,50 + ammonizione</span></div>

    `<p class="note">La Direzione si riserva il diritto di apportare modifiche al regolamento in qualsiasi momento. Eventuali modifiche non hanno valenza retroattiva.</p>
     <p>Direzione PadelMeeting — <b>Pangurme Srl</b><br>www.padelmeeting.it</p>`],

let ruleOpen=0;
function viewRules(){
  return `<div class="page">
    ${stag('Regolamento · sintesi')}
    <div class="card" style="padding:18px 20px;margin-bottom:14px">
      <div style="font-family:var(--serif);font-size:22px;font-style:italic">La classifica che <span class="glow">si muove</span> ad ogni partita</div>
      <p class="c-dim" style="font-size:13px;line-height:1.6;margin-top:8px">Sintesi completa del regolamento PadelMeeting. Tocca una voce per espanderla.</p>
    </div>
    ${RULES.map((r,i)=>`<div class="card acc ${ruleOpen===i?'open':''}" onclick="toggleRule(${i})">
      <div class="ah"><span class="at" style="color:${ruleOpen===i?C.neon:C.ivory}">${r[0]}</span><span class="ax">+</span></div>
      <div class="ab">${r[1]}</div></div>`).join('')}
    <div class="center" style="margin-top:18px;font-size:10px;color:var(--ivoryFaint);font-family:var(--mono);letter-spacing:.14em">DIREZIONE PADELMEETING · PANGURME SRL</div>
  </div>`;
}
function toggleRule(i){ruleOpen=ruleOpen===i?-1:i;render()}

/* ============ ORGANIZZA ============ */
let org = { date:'', time:'18:00', format:'classic', partner:1, opp1:3, opp2:4, sent:false };

function viewOrganize(){
  if(org.sent){
    return `<div class="page"><div class="card rise center" style="padding:44px 24px;margin-top:16px">
      <div style="font-size:40px;margin-bottom:8px">📅</div>
      <div style="font-family:var(--serif);font-size:28px;font-style:italic;color:${C.gold};text-shadow:0 0 14px #EFD06A44">Inviti inviati!</div>
      <p class="c-dim" style="font-size:13px;line-height:1.65;max-width:300px;margin:12px auto 0">I giocatori riceveranno una notifica. La partita sarà confermata quando tutti e 4 avranno accettato.</p>
      <div style="margin-top:24px;display:flex;gap:10px;justify-content:center">
        <button class="btnGhost" onclick="resetOrg()">Nuova</button>
        <button class="btnSolid" onclick="go('home')">Home</button>
      </div>
    </div></div>`;
  }

  const others = players.filter(p => p.id !== ME);
  const opt = (sel, exclude) => others.map(p =>
    `<option value="${p.id}" ${p.id===sel?'selected':''} ${exclude.includes(p.id)?'disabled':''}>
      ${esc(p.name)} · ${p.rating.toFixed(2)}
    </option>`).join('');

  const t1=[ME,org.partner], t2=[org.opp1,org.opp2];
  const valid = new Set([...t1,...t2]).size===4;
  const calc  = valid ? computeMatch(t1,t2,org.format,1) : null;

  let preview='';
  if(calc){
    const col = calc.diff<=1.0?C.neon:calc.diff<=2.0?C.gold:C.rust;
    const label = calc.diff<=1.0?'Partita equilibrata':calc.diff<=2.0?'Lieve vantaggio coppia A':'Grande differenza';
    preview=`<div class="card rise" style="margin-top:14px;border-color:${col}44">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <span style="font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:${col}">${label}</span>
        <span style="font-family:var(--mono);font-size:13px;color:${col};font-weight:700">Δ ${calc.diff.toFixed(2)}</span>
      </div>
      <div class="mgrid">
        <div class="mside">
          ${[ME,org.partner].map(id=>`<div class="pl" style="color:${C.neon};font-weight:600">${esc(pName(id))}</div>`).join('')}
          <div style="font-size:10px;color:var(--ivoryFaint);font-family:var(--mono);margin-top:3px">Σ ${calc.sum1.toFixed(2)}</div>
        </div>
        <div class="mscore" style="font-size:16px;font-family:var(--serif);font-style:italic;color:var(--rust)">vs</div>
        <div class="mside" style="text-align:right">
          ${[org.opp1,org.opp2].map(id=>`<div class="pl" style="color:${C.ivory}">${esc(pName(id))}</div>`).join('')}
          <div style="font-size:10px;color:var(--ivoryFaint);font-family:var(--mono);margin-top:3px">Σ ${calc.sum2.toFixed(2)}</div>
        </div>
      </div>
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--lineSoft);display:flex;justify-content:space-between">
        <span style="font-size:11px;color:var(--ivoryFaint)">Vittoria coppia A vale</span>
        <span style="font-family:var(--mono);font-size:12px;font-weight:700;color:${C.neon}">${org.format==='single'?Math.abs(calc.res[ME].delta/2).toFixed(2):Math.abs(calc.res[ME].delta).toFixed(2)} pt ciascuno</span>
      </div>
      ${calc.diff>2.0?`<div class="warn c-rust" style="margin-top:8px">⚠ Differenza > 2.0 — richiede approvazione della coppia forte.</div>`:''}
    </div>`;
  }

  return `<div class="page">
    ${stag('Organizza partita')}

    <div class="card rise">
      <div style="font-size:11px;letter-spacing:.16em;font-family:var(--mono);color:var(--ivoryFaint);text-transform:uppercase;margin-bottom:10px">Quando</div>
      <div class="org-row">
        <input type="date" class="org-date" value="${org.date}" onchange="org.date=this.value;render()">
        <input type="time" class="org-time" value="${org.time}" onchange="org.time=this.value;render()">
      </div>
    </div>

    ${stag('Formato')}
    <div class="seg">
      <button class="segBtn ${org.format==='classic'?'active':''}" onclick="org.format='classic';render()">Classica · 2 su 3</button>
      <button class="segBtn ${org.format==='single'?'active':''}" onclick="org.format='single';render()">Set singolo</button>
    </div>

    ${stag('Giocatori')}
    <div class="card" style="margin-top:4px">
      <div class="teamBlock" style="border-left:2px solid ${C.neon}">
        <div class="tt" style="color:${C.neon}">La tua coppia</div>
        <div class="selWrap"><span class="selLabel">Tu</span><div class="selBox fixed">${esc(pName(ME))}</div></div>
        <div class="selWrap"><span class="selLabel">Compagno</span>
          <select class="selBox" onchange="org.partner=+this.value;render()">${opt(org.partner,[org.opp1,org.opp2])}</select></div>
      </div>
      <div class="vs">VS</div>
      <div class="teamBlock" style="border-left:2px solid ${C.rust}">
        <div class="tt" style="color:${C.rust}">Avversari</div>
        <div class="selWrap"><span class="selLabel">Avversario 1</span>
          <select class="selBox" onchange="org.opp1=+this.value;render()">${opt(org.opp1,[org.partner,org.opp2])}</select></div>
        <div class="selWrap"><span class="selLabel">Avversario 2</span>
          <select class="selBox" onchange="org.opp2=+this.value;render()">${opt(org.opp2,[org.partner,org.opp1])}</select></div>
      </div>
    </div>

    ${preview}

    <button class="cta" ${valid?'':'disabled'} onclick="sendOrg()">
      <span>📅 Invia inviti</span>
    </button>
  </div>`;
}
function resetOrg(){org={date:'',time:'18:00',format:'classic',partner:1,opp1:3,opp2:4,sent:false};render()}
function sendOrg(){if(new Set([ME,org.partner,org.opp1,org.opp2]).size===4){org.sent=true;render()}}

/* ============ NAV / RENDER ============ */
const NAV=[['home','Home','◈'],['rank','Classifica','≡'],['organize','Organizza','📅'],['play','','⚡'],['matches','Partite','⊞'],['profile','Profilo','◉']];
function renderNav(){
  $('#nav').innerHTML=NAV.map(([k,l,ic])=>{
    const active=tab===k, isPlay=k==='play';
    return `<button class="navBtn ${active?'active':''} ${isPlay?'navPlay':''}" onclick="go('${k}')">
      <span class="ic">${ic}</span>${isPlay?'':`<span class="nl">${l}</span>`}${active&&!isPlay?'<span class="dot"></span>':''}</button>`;
  }).join('');
}
function go(t){tab=t;if(t!=='play')pl.done=false;window.scrollTo&&($('#view').scrollTop=0);render()}
function render(){
  const v={home:viewHome,rank:viewRank,play:viewPlay,organize:viewOrganize,matches:viewMatches,profile:viewProfile,rules:viewRules}[tab];
  $('#view').innerHTML=v();
  renderNav();
}
$('#emblem').innerHTML=emblem(42);
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
